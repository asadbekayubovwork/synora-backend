<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>protoVoice API</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0 }
    .pick { font: 14px/1.4 system-ui, sans-serif; padding: 12px 16px;
            background: #1b1b1b; color: #eee; display: flex; gap: 16px; align-items: center }
    .pick a { color: #7cc; text-decoration: none; cursor: pointer }
    .pick a.on { color: #fff; font-weight: 600; text-decoration: underline }
  </style>
</head>
<body>
  <div class="pick">
    <span>Schema:</span>
    <a id="p" class="on">public (PUBLIC_API=1)</a>
    <a id="f">full (local only)</a>
  </div>
  <div id="ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    const render = (url) => SwaggerUIBundle({ url, dom_id: '#ui' });
    const p = document.getElementById('p'), f = document.getElementById('f');
    const pick = (el, url) => {
      for (const e of [p, f]) e.classList.toggle('on', e === el);
      render(url);
    };
    p.onclick = () => pick(p, 'openapi-public.json');
    f.onclick = () => pick(f, 'openapi-full.json');
    render('openapi-public.json');
  </script>
</body>
</html>
