[pytest]
testpaths = tests
# The project root, so `pytest` finds `app` the way `python -m pytest` does.
# Without it the console script leaves the root off sys.path and every test
# fails at `import app`.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
