[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# A deadlock in a concurrency test would otherwise hang CI forever. Generous,
# because bcrypt makes the auth tests genuinely slow.
timeout = 120
markers =
    pg: needs a real PostgreSQL database (skipped on SQLite)
filterwarnings =
    ignore::DeprecationWarning
