# Alembic is the schema authority for this project. `init_db()` only creates
# missing tables, so it can bring a fresh SQLite file up but can never alter a
# deployed one — see `alembic/README`.
#
# The database URL is deliberately absent: `env.py` reads it from `Settings`,
# so there is one place a connection string can come from and no chance of a
# migration running against a different database than the app.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Zero-padded so `ls` sorts the way the revisions run.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
