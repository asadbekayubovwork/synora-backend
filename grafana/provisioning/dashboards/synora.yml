apiVersion: 1

providers:
  - name: synora
    type: file
    # The files are mounted read-only, so Grafana's own editor cannot save over
    # them. Edit the JSON in the repository and restart the container: a
    # dashboard that lives in a container's database is a dashboard nobody else
    # has.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
